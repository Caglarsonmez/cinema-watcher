name: UCI Dune watcher

on:
  workflow_dispatch:   # triggered externally by cron-job.org

permissions:
  contents: write      # needed to commit state.json

concurrency:
  group: uci-dune-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check for screenings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python uci_dune_watch.py

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update state"
            git push
          fi
