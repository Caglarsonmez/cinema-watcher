name: cinema-watcher

on:
  schedule:
    - cron: "0 * * * *"   # every 10 min; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification instead of checking"
        type: boolean
        default: false

permissions:
  contents: write             # needed to commit state.json back to the repo

concurrency:
  group: cinema-watcher       # never run two checks at once (avoids state conflicts)
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 cinema_watcher.py ${{ inputs.test && '--test' || '' }}

      - name: Save state
        if: always()          # also save the failure counter when the run fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
